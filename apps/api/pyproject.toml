[project]
name = "hunar-api"
version = "0.1.0"
description = "Hunar v2 — AI-powered platform for Pakistani home-business women"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "openai-agents>=0.0.22",
    "python-multipart>=0.0.12",
    "psycopg[binary]>=3.2.0",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "S", "T20", "RUF"]
ignore = ["S101", "B008", "E501"]  # allow assert in tests, allow FastAPI Depends, ignore line-length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# tests/test_seed.py imports the repo-level scripts/seed.py
mypy_path = "../../scripts"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: marks tests that require real API keys (deselect with '-m \"not live\"')",
]
