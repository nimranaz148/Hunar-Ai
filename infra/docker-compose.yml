services:
  postgres:
    image: postgres:16-alpine
    container_name: hunar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hunar
      POSTGRES_PASSWORD: hunar_dev
      POSTGRES_DB: hunar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunar"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
