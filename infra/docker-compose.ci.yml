services:
  postgres:
    image: postgres:16-alpine
    container_name: hunar-postgres-ci
    environment:
      POSTGRES_USER: hunar
      POSTGRES_PASSWORD: hunar_ci
      POSTGRES_DB: hunar_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunar"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data
