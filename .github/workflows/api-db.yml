name: api-db

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-db.yml"
      - "scripts/verify.sh"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-db.yml"
      - "scripts/verify.sh"

concurrency:
  group: api-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify.sh --lane api-db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Verify
        env:
          DATABASE_URL: postgresql+psycopg://postgres:verify@localhost:5432/verify
        run: bash scripts/verify.sh --lane api-db
