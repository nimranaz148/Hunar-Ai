name: contract

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/api-client/**"
      - ".github/workflows/contract.yml"
      - "scripts/verify.sh"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/api-client/**"
      - ".github/workflows/contract.yml"
      - "scripts/verify.sh"

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify.sh --lane contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Verify
        run: bash scripts/verify.sh --lane contract
