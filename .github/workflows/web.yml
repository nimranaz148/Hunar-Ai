name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
      - "scripts/verify.sh"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
      - "scripts/verify.sh"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify.sh --lane web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify
        run: bash scripts/verify.sh --lane web
      - name: Security audit
        run: |
          if [ -f apps/web/package.json ]; then
            cd apps/web && npm audit --audit-level=high || true
          fi
